<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DiffLocks 发型工作台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel input-panel">
        <div class="panel-head">
          <h1>DiffLocks 发型工作台</h1>
          <span id="health" class="status-pill">就绪</span>
        </div>

        <form id="job-form">
          <label class="drop-zone" for="image">
            <input id="image" name="image" type="file" accept="image/*" required />
            <span id="file-label">选择或拖入人像图片</span>
          </label>

          <div class="examples-wrap">
            <div class="examples-head">
              <span>官方示例图片</span>
              <small>点击同步图片和参数</small>
            </div>
            <div id="examples" class="examples"></div>
          </div>

          <div class="grid">
            <label>
              随机种子
              <input name="seed" type="number" value="5" step="1" />
            </label>
            <label>
              采样步数
              <input name="steps" type="number" value="150" min="25" max="400" step="25" />
            </label>
            <label>
              图像引导强度
              <input name="cfg" type="number" value="1.3" min="0.1" max="4" step="0.1" />
            </label>
            <label>
              裁剪倍率
              <input name="crop" type="number" value="2.8" min="1.8" max="4" step="0.1" />
            </label>
            <label>
              发丝密度
              <input name="upsample" type="number" value="3" min="1" max="8" step="1" />
            </label>
            <label>
              解码分块数（不改发丝数）
              <input name="decode_chunks" type="number" value="10" min="5" max="100" step="5" />
            </label>
            <label>
              导出发丝比例
              <input name="strand_subsample" type="number" value="1" min="0.05" max="1" step="0.05" />
            </label>
            <label>
              单根点数比例
              <input name="vertex_subsample" type="number" value="0.5" min="0.125" max="1" step="0.125" />
            </label>
            <label>
              发丝半径（米）
              <input name="radius" type="number" value="0.0001" min="0.00001" max="0.01" step="0.00001" />
            </label>
            <label>
              预览分辨率
              <input name="preview_resolution" type="number" value="900" min="400" max="1600" step="100" />
            </label>
          </div>

          <button id="reset-params" type="button" class="secondary">重置为默认参数</button>
          <button id="submit" type="submit">开始推理</button>
        </form>
      </section>

      <section class="panel result-panel">
        <div class="panel-head">
          <h2>任务</h2>
          <button id="refresh" type="button" class="ghost">刷新</button>
        </div>
        <div id="jobs" class="jobs"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
